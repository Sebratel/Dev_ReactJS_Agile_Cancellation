services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: DB_Cancellation_Plataform
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/DB_Cancellation_Plataform?connection_limit=5
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      DATA_SOURCE_MODE: database
      PRISMA_AUTO_CONNECT: 'true'
      ELEVEN_MODE: ${ELEVEN_MODE:-disabled}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_MATRIX_HSM_WEBHOOK_URL: ${N8N_MATRIX_HSM_WEBHOOK_URL:-}
      N8N_MATRIX_HSM_WEBHOOK_SECRET: ${N8N_MATRIX_HSM_WEBHOOK_SECRET:-}
      N8N_MATRIX_HSM_TIMEOUT_MS: ${N8N_MATRIX_HSM_TIMEOUT_MS:-15000}
      ERP_SYNC_ENABLED: ${ERP_SYNC_ENABLED:-false}
      ERP_DB_HOST: ${ERP_DB_HOST:-}
      ERP_DB_PORT: ${ERP_DB_PORT:-5432}
      ERP_DB_NAME: ${ERP_DB_NAME:-}
      ERP_DB_USER: ${ERP_DB_USER:-}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:-}
      ERP_DB_SSL: ${ERP_DB_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-GER - Gestao de Cobranca e Cancelamento}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - api

volumes:
  db_data:
