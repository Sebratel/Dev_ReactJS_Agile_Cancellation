name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilegio: o CI so le o repositorio.
permissions:
  contents: read

# Push novo cancela o run anterior da mesma branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacoes:
    name: Validacoes do compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Nomes do compose e gateway por ambiente
        run: |
          pip install pyyaml
          env_alvo=staging
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then env_alvo=production; fi
          python3 .github/scripts/validate-compose.py \
            --repo Dev_ReactJS_Agile_Cancellation --env "$env_alvo" \
            --exceptions .github/compose-exceptions.txt \
            docker-compose.portainer.yml

  frontend:
    name: Frontend - qualidade, testes (cobertura >= 70%), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # o mesmo da imagem Docker (node:22)
          cache: npm

      - run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Security scan
        run: npm run security:scan

      - name: Testes com cobertura (limite 70% em vite.config.ts)
        run: npm run test:run
        env:
          VITE_API_BASE_URL: http://localhost:4000

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000

      # [RECOMENDADO] comeca como aviso; promova a bloqueante quando zerar o backlog.
      - name: Auditoria de dependencias (aviso)
        run: npm audit --audit-level=high --omit=dev || echo "::warning::npm audit encontrou vulnerabilidades high+ (frontend)"

  backend:
    name: Backend - qualidade, testes (cobertura >= 70%), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # o mesmo da imagem Docker (node:22)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npm run prisma:validate
        env:
          DATABASE_URL: mysql://USER:PASSWORD@HOST:3306/db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Security scan
        run: npm run security:scan

      - name: Testes com cobertura (limite 70% em jest.config.ts)
        run: npm run test:run
        env:
          DATA_SOURCE_MODE: mock
          PRISMA_AUTO_CONNECT: 'false'
          JWT_SECRET: ci-test-secret-placeholder-not-production

      - name: Build
        run: npm run build

      - name: Auditoria de dependencias (aviso)
        run: npm audit --audit-level=high --omit=dev || echo "::warning::npm audit encontrou vulnerabilidades high+ (backend)"

  imagem:
    name: Imagens Docker + smoke da stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ger-cancelamento-ci
      # Segredos descartaveis, validos so dentro do runner.
      MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
      MARIADB_USER: ger
      MARIADB_PASSWORD: ci-db-not-a-secret
      # A API roda com NODE_ENV=production: exige segredos fortes e CORS_ORIGIN fora de localhost.
      JWT_SECRET: ci-smoke-9f8e7d6c5b4a39281706f5e4d3c2b1a0
      N8N_WEBHOOK_SECRET: ci-smoke-webhook-0123456789abcdef
      GOOGLE_AUTH_MODE: mock
      CORS_ORIGIN: https://ger-ci.example.com
      API_PORT: '4000'
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4

      - name: Construir as imagens
        run: docker compose -f docker-compose.portainer.yml build

      # --wait espera o healthcheck, o mesmo criterio que o Portainer usa
      - name: Subir a stack
        run: docker compose -f docker-compose.portainer.yml up -d --wait --wait-timeout 240

      - name: Health da API responde ok
        run: |
          curl -fsS --retry 15 --retry-delay 3 --retry-connrefused \
            http://localhost:4000/health -o health.json
          grep -q '"status":"ok"' health.json || {
            echo "::error::/health devolveu resposta inesperada:"; cat health.json; exit 1; }

      - name: Frontend serve a SPA e faz proxy da API
        run: |
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root"' || {
            echo "::error::frontend nao serviu o index.html"; exit 1; }
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"' || {
            echo "::error::proxy /api do nginx nao alcancou o backend"; exit 1; }

      - name: Logs da stack
        if: failure()
        run: docker compose -f docker-compose.portainer.yml logs --no-color --timestamps > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.portainer.yml down -v

  # Check unico para a protecao de branch. `if: always()` no job, senao ele e pulado
  # quando um `needs` falha e o check nunca reporta.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [validacoes, frontend, backend, imagem]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Pelo menos um job nao passou."; exit 1
          fi
          echo "Tudo verde."

  # CD de staging: com o `ci-ok` verde, avisa o Portainer, que faz pull do Git,
  # rebuilda e redeploya a stack (GitOps). A URL do webhook e segredo do repositorio
  # (Settings > Secrets and variables > Actions > PORTAINER_WEBHOOK_STAGING): ela
  # contem o token e nunca vai para o codigo nem para o log.
  deploy-staging:
    name: Deploy staging (Portainer)
    runs-on: ubuntu-latest
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    timeout-minutes: 5
    # Um deploy por vez e nunca cancela um em andamento.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Acionar o webhook do Portainer
        env:
          PORTAINER_WEBHOOK_STAGING: ${{ secrets.PORTAINER_WEBHOOK_STAGING }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_STAGING" ]; then
            echo "::error::Segredo PORTAINER_WEBHOOK_STAGING nao configurado no repositorio."; exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --retry 3 --retry-delay 5 --max-time 60 "$PORTAINER_WEBHOOK_STAGING")
          echo "Portainer respondeu HTTP $status"
          case "$status" in
            2??) echo "Redeploy de staging solicitado para ${GITHUB_SHA::7}." ;;
            *) echo "::error::Webhook do Portainer falhou (HTTP $status)."; exit 1 ;;
          esac
